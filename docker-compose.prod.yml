services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Внутри сети Compose localhost не указывает на Postgres.
      PLATFORM_DB_DSN: postgres://lecturelog:${WEB_POSTGRES_PASSWORD:?WEB_POSTGRES_PASSWORD is required}@postgres:5432/lecturelog?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lecturelog
      POSTGRES_PASSWORD: ${WEB_POSTGRES_PASSWORD:?WEB_POSTGRES_PASSWORD is required}
      POSTGRES_DB: lecturelog
    ports:
      - "5432:5432"
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturelog -d lecturelog"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-prod-data:
