name: Docker Publish

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
  workflow_dispatch:

# Публикации в один и тот же ref строго последовательны. Без этого два мержа
# подряд дают гонку перезаписи тега: прогон более раннего коммита заканчивается
# позже (сборка мультиарх идёт минутами и время выполнения не одинаково) и
# затирает :dev своим образом, откатывая тег на старый код. Ровно это произошло
# при мерже PR #6 и #5: :dev указывал на сборку без изменений из PR #5.
# cancel-in-progress не ставим — прерванная публикация оставила бы тег в
# неопределённом состоянии; лучше дождаться и опубликовать поверх.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/lecturelog/lecturelog-web

jobs:
  # Тот же гейт, что и на pull request — единое определение в gate.yml,
  # чтобы проверки PR не могли разойтись с тем, что гейтит публикацию образа.
  gate:
    uses: ./.github/workflows/gate.yml

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare tags
        id: tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:${GITHUB_REF_NAME}"
              echo "${IMAGE_NAME}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_REF_NAME}" == "dev" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:dev"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "tags<<EOF"
              echo "${IMAGE_NAME}:dev"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported ref: ${GITHUB_REF_TYPE}/${GITHUB_REF_NAME}" >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            Docker images:
            - `ghcr.io/lecturelog/lecturelog-web:${{ github.ref_name }}`
            - `ghcr.io/lecturelog/lecturelog-web:latest`
