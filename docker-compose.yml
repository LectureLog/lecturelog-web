services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lecturelog
      POSTGRES_PASSWORD: lecturelog
      POSTGRES_DB: lecturelog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturelog -d lecturelog"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    # Заглушка MinIO ядра для изолированной разработки без реального ядра.
    profiles: ["stub-minio"]
    environment:
      MINIO_ROOT_USER: lecturelog
      MINIO_ROOT_PASSWORD: lecturelog-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    profiles: ["stub-minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 lecturelog lecturelog-minio-secret &&
      mc mb --ignore-existing local/lecturelog &&
      mc anonymous set download local/lecturelog
      '

volumes:
  postgres-data:
  minio-data:
