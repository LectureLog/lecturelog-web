services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lecturelog
      POSTGRES_PASSWORD: ${WEB_POSTGRES_PASSWORD:?WEB_POSTGRES_PASSWORD is required}
      POSTGRES_DB: lecturelog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecturelog -d lecturelog"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    # Заглушка MinIO ядра для изолированной разработки без реального ядра.
    profiles: ["stub-minio"]
    environment:
      MINIO_ROOT_USER: ${CORE_MINIO_ACCESS_KEY:?CORE_MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${CORE_MINIO_SECRET_KEY:?CORE_MINIO_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    profiles: ["stub-minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      CORE_MINIO_ACCESS_KEY: ${CORE_MINIO_ACCESS_KEY:?CORE_MINIO_ACCESS_KEY is required}
      CORE_MINIO_SECRET_KEY: ${CORE_MINIO_SECRET_KEY:?CORE_MINIO_SECRET_KEY is required}
      CORE_MINIO_BUCKET: ${CORE_MINIO_BUCKET:?CORE_MINIO_BUCKET is required}
    entrypoint: >-
      /bin/sh -c '
      mc alias set local http://minio:9000 "$$CORE_MINIO_ACCESS_KEY" "$$CORE_MINIO_SECRET_KEY" &&
      mc mb --ignore-existing "local/$$CORE_MINIO_BUCKET" &&
      mc anonymous set download "local/$$CORE_MINIO_BUCKET"
      '

volumes:
  postgres-data:
  minio-data:
